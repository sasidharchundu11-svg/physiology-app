(function(){const ov=document.createElement("div");ov.id="iv";ov.setAttribute("role","dialog");

 let s=1,x=0,y=0,bw=0,bh=0,open=false;const P=new Map();let pinch=null,last=0,moved=false,tdbl=0;

 document.addEventListener("click",e=>{const i=e.target.closest("main img");if(!i||i.closest("#iv"))return;e.preventDefault();const f=i.closest("figure");openViewer(i.getAttribute("src"),f?(f.querySelector("figcaption").innerText||f.querySelector("figcaption").textContent).replace(/\s*\n\s*/g," · "):(i.alt||""))});
})();

function ytBtns(k){const N=(window.YTNN||{})[k];let L=(window.YT2||{})[k]||[];if(N)L=L.filter(y=>y.url!==N.url);const nn=N?`<a class="btn yt nn" href="${esc(N.url)}" target="_blank" rel="noopener" style="display:block;text-align:left;margin:8px 0;background:#111;color:#fff;padding:12px;border-radius:10px;text-decoration:none;border:2px solid #f5c400">🥷 <b style="color:#f5c400">Ninja Nerd</b> · ▶ Watch${N.dur?" · "+esc(N.dur):""}<br><b>${esc(N.title)}</b><br><small>Official Ninja Nerd lecture · needs internet (opens YouTube app/browser)</small></a>`:"";return nn+L.map(y=>`<a class="btn yt" href="${esc(y.url)}" target="_blank" rel="noopener" style="display:block;text-align:left;margin:8px 0;background:#c4302b;color:#fff;padding:10px 12px;border-radius:10px;text-decoration:none">▶ Watch on YouTube${y.dur?" · "+esc(y.dur):""}<br><b>${esc(y.title)}</b><br><small>${esc(y.channel)} · needs internet (opens YouTube app/browser)</small></a>`).join("")}
function xNote(x){let h=`<p><b>🔑 Key points</b></p><ul>${x.kp.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`;
 if(x.tb)h+=`<div class="tbl"><table><tr>${x.tb[0].map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${x.tb.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
 if(x.mn)h+=`<p><b>🧠 Mnemonic:</b> ${esc(x.mn)}</p>`;if(x.ex)h+=`<p><b>✍️ Exam answer outline:</b> ${esc(x.ex)}</p>`;return h}
function videos(v){const Y=window.YT2||{};let n=0,c=0;Object.values(Y).forEach(l=>{n+=l.length;if(l.length)c++});
 v.innerHTML=`<h2>▶ Videos</h2><p class="mut">${n} verified YouTube videos for ${c} of ${NCH} chapters from trusted channels (Ninja Nerd, Osmosis, Khan Academy, Dr Najeeb, Kenhub, Armando Hasudungan, medical colleges). They open in YouTube/browser and <b>need internet</b>; nothing is downloaded. Offline clips are inside each chapter.</p>`+
 REG.map(r=>{const d=D(r);return `<details><summary><b>${esc(d.name)}</b> <small class="mut">(${d.topics.filter(t=>(Y[r+"|"+t]||[]).length).length}/${d.topics.length})</small></summary>`+d.topics.map((t,i)=>{const L=Y[r+"|"+t]||[];return `<div class="card"><a href="#/study/${r}/${i}"><b>${esc(t)}</b></a>${L.length?ytBtns(r+"|"+t):`<p class="mut">No verified video from a trusted channel yet – use the chapter notes and Free Resources.</p>`}</div>`}).join("")+`</details>`}).join("")}
function resources(v){const R=window.RES||{list:[],off:[]};const cats=[...new Set(R.list.map(x=>x[0]))];
 v.innerHTML=`<h2>📚 Free resources</h2><p class="mut">Trusted, legal, free material. 📥 = readable offline inside the app; 🔗 = opens in browser (needs internet). Links were checked when this version was made.</p>
 <h3>📥 Offline reading (bundled)</h3><div class="card"><p class="mut">Text of selected sections of <i>Anatomy and Physiology 2e</i> by OpenStax (Rice University), licensed CC BY 4.0. Figures omitted. Use alongside Guyton, AK Jain and Sembulingam.</p>${R.off.map(o=>`<a class="li" href="resources/${esc(o.f)}"><span class="t"><b>${esc(o.t)}</b><br><small class="mut">${o.kb} KB · CC BY 4.0</small></span>›</a>`).join("")}</div>`+
 cats.map(c=>`<h3>${esc(c)}</h3>`+R.list.filter(x=>x[0]==c).map(x=>`<div class="card"><a href="${esc(x[2])}" target="_blank" rel="noopener"><b>${x[4]=="offline"?"📥":"🔗"} ${esc(x[1])}</b></a><p>${esc(x[3])}</p>${x[5]?`<small class="mut">Licence: ${esc(x[5])}</small>`:""}</div>`).join("")).join("")}

/* ---------- MY NOTES (stable key: section|chapter title, own localStorage key so app updates never wipe it) ---------- */
function mnAll(){try{return JSON.parse(localStorage.getItem(MNK)||"{}")||{}}catch(e){return{}}}
function mnSave(o){try{localStorage.setItem(MNK,JSON.stringify(o));return true}catch(e){return false}}
function myNoteCount(){return Object.values(mnAll()).filter(x=>x&&x.t&&x.t.trim()).length}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}
function myNoteBox(k){const x=mnAll()[k];return`<textarea id="mynote" rows="6" placeholder="Type your own notes for this chapter… (saved automatically on this device)" aria-label="My notes for this chapter">${esc(x&&x.t||"")}</textarea><div class="mnbar"><small id="mnst" class="mut" aria-live="polite">${x&&x.t?"✓ Saved "+fmtTime(x.ts):"Not saved yet"}</small><button id="mnclr" type="button">🗑 Clear</button></div>`}
function initMyNote(k){const ta=$("#mynote");if(!ta)return;const st=$("#mnst");let tm;
 const doSave=()=>{const o=mnAll(),v=ta.value;if(v.trim())o[k]={t:v,ts:Date.now()};else delete o[k];st.textContent=mnSave(o)?(v.trim()?"✓ Saved "+fmtTime(Date.now()):"Empty – nothing saved"):"⚠ Could not save (storage full?)"};
 ta.oninput=()=>{st.textContent="Saving…";clearTimeout(tm);tm=setTimeout(doSave,500)};ta.onblur=()=>{clearTimeout(tm);doSave()};
 $("#mnclr").onclick=()=>{if(!ta.value.trim())return;if(confirm("Delete your notes for this chapter? This cannot be undone.")){ta.value="";doSave();toast("Notes cleared")}}}
function chLoc(k){const i=k.indexOf("|"),r=k.slice(0,i),t=k.slice(i+1),d=D(r);return d?{r,t,ci:d.topics.indexOf(t),sec:d.name}:null}
function myNotesPage(v){const o=mnAll(),ks=Object.keys(o).filter(k=>o[k]&&o[k].t&&o[k].t.trim()).sort((a,b)=>o[b].ts-o[a].ts);
 v.innerHTML=`<h2>📝 My Notes</h2><p class="mut">Your own notes from every chapter. They stay on this device and are kept when the app is updated.</p><input type="search" id="mnq" placeholder="Search your notes…" aria-label="Search my notes"><div class="qs" style="margin:10px 0"><button id="mncp">📋 Copy all</button><button id="mnex">⬇️ Export .txt</button></div><div id="mnl"></div>`;
 const list=q=>{q=(q||"").toLowerCase();const L=ks.filter(k=>!q||(k+" "+o[k].t).toLowerCase().includes(q));
  $("#mnl").innerHTML=L.length?`<div class="card">`+L.map(k=>{const c=chLoc(k);if(!c)return"";const body=o[k].t.trim();return`<a class="li" href="#/study/${c.r}/${c.ci<0?0:c.ci}"><span class="t"><b>${esc(c.t)}</b><br><small class="mut">${esc(c.sec)} · ${fmtTime(o[k].ts)}</small><br><small>${esc(body.length>140?body.slice(0,140)+"…":body)}</small></span>›</a>`}).join("")+`</div>`:`<p class="card mut">${ks.length?"No notes match your search.":"No notes yet. Open any chapter and use the 📝 My Notes box at the bottom."}</p>`};
 list("");$("#mnq").oninput=e=>list(e.target.value);
 const txt=()=>"My Physiology Notes – exported "+new Date().toLocaleString()+"\n\n"+ks.map(k=>{const c=chLoc(k)||{sec:"",t:k};return`=== ${c.sec} › ${c.t} ===\n${o[k].t.trim()}\n`}).join("\n");
 $("#mncp").onclick=()=>{if(!ks.length)return toast("No notes yet");const t=txt();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("All notes copied ✓"),()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("All notes copied ✓")}catch(e){toast("Copy failed")}a.remove()})};
 $("#mnex").onclick=()=>{if(!ks.length)return toast("No notes yet");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt()],{type:"text/plain"}));a.download="my-physiology-notes.txt";document.body.appendChild(a);a.click();a.remove()}}
/* ---------- DETAILED NOTES + QUICK REVISION ---------- */
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function fmtDetail(s){let h="",ul=0;for(const l of s.split("\n")){const x=l.trim();if(!x){if(ul){h+="</ul>";ul=0}continue}
 if(x.startsWith("- ")){if(!ul){h+="<ul>";ul=1}h+=`<li>${inl(x.slice(2))}</li>`;continue}if(ul){h+="</ul>";ul=0}
 h+=x.startsWith("## ")?`<h4>${inl(x.slice(3))}</h4>`:`<p>${inl(x)}</p>`}return h+(ul?"</ul>":"")}
function qrHtml(q){return`<ul class="qr">${q.b.map(x=>`<li>${inl(x)}</li>`).join("")}</ul><p><b>🔢 Must-know numbers</b></p><ul class="qrn">${q.n.map(x=>`<li>${inl(x)}</li>`).join("")}</ul><p class="qrm"><b>🧠 Mnemonic:</b> ${inl(q.m)}</p><p><b>🎤 Viva one-liners</b></p><ol>${q.v.map(x=>`<li>${inl(x)}</li>`).join("")}</ol>`}
function revMode(v){const all=[];REG.forEach(r=>{const d=D(r);d&&d.topics.forEach((t,ci)=>{const N=(window.ND||{})[r+"|"+t];if(N&&N.q)all.push({r,t,ci})})});
 const secs=REG.filter(r=>all.some(a=>a.r==r));let i=Math.max(0,Math.min(all.length-1,+(S.revi||0)));
 const draw=()=>{const a=all[i];if(!a){v.innerHTML=`<p class="card mut">No revision sheets.</p>`;return}S.revi=i;save();const N=ND[a.r+"|"+a.t],d=D(a.r),si=all.filter(x=>x.r==a.r),k=si.indexOf(a);
  v.innerHTML=`<select id="rvs" aria-label="Section">${secs.map(r=>`<option value="${r}" ${r==a.r?"selected":""}>${esc(D(r).name)}</option>`).join("")}</select>
  <div class="card rvc"><small class="mut">${esc(d.name)} · ${k+1}/${si.length} · sheet ${i+1}/${all.length}</small><h2 class="cht">⚡ ${esc(a.t)}</h2>${qrHtml(N.q)}<a href="#/study/${a.r}/${a.ci}">Open full chapter ›</a></div>
  <div class="pn rvpn"><button id="rvp" ${i?"":"disabled"}>‹ Prev</button><button id="rvn" class="primary" ${i<all.length-1?"":"disabled"}>Next ›</button></div>`;
  $("#rvp").onclick=()=>{if(i>0){i--;draw();scrollTo(0,0)}};$("#rvn").onclick=()=>{if(i<all.length-1){i++;draw();scrollTo(0,0)}};
  $("#rvs").onchange=e=>{i=all.findIndex(x=>x.r==e.target.value);draw()}};draw()}
</script><script>window.MBBS_APP={id:"physiology",versionCode:10,versionName:"2.1",contentVersion:1};</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW",e)));</script></body></html>
