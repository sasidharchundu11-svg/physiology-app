<script>"use strict";
const VER="1.5",K="kiranPhysio_v1";
let LS=null;try{LS=window.localStorage;LS.getItem(K)}catch(e){LS=null}
const DEF={theme:"system",accent:"#2f6fed",font:16,qn:10,timer:false,secs:45,expl:"now",shufOpt:true,goal:30,sound:false,vib:false};
function norm(s){s=s&&typeof s=="object"?s:{};
 for(const k of ["seen","missed","scores","tp","days","cdays","read","rdays"])if(!s[k]||typeof s[k]!="object")s[k]={};
 s.bm=s.bm&&typeof s.bm=="object"?s.bm:{};s.bm.q=s.bm.q||{};s.bm.f=s.bm.f||{};
 s.set=Object.assign({},DEF,s.set||{});s.last=s.last||null;s.cq=s.cq||null;s.lc=s.lc||null;s.v=3;return s}
function load(){let s=null;try{s=JSON.parse(LS&&LS.getItem(K))}catch(e){}
 if(!s){s={};try{const o=null;if(o){s.seen={};Object.values(o.seen||{}).forEach(m=>Object.assign(s.seen,m));s.missed=o.missed||{};s.scores=o.scores||{};s.set={theme:o.theme=="light"?"light":"dark"}}}catch(e){}}
 return norm(s)}
let S=load();
const save=()=>{try{LS&&LS.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dkey(new Date());
const REG=["gp","bl","nm","gi","cv","rs","rn","en","rp","cn","ss","ip","pr"].filter(r=>window.QB&&QB[r]);
const D=r=>QB[r];
const byId={},FCK={};
REG.forEach(r=>{D(r).mcq.forEach(q=>byId[q.id]=q);D(r).fc.forEach(f=>FCK[r+"|"+f[0]]=[r,f])});
const regOf=q=>q.id.split("-")[0];
const chIdx=(r,t)=>D(r).topics.indexOf(t);
const NQ=Object.keys(byId).length,NF=Object.keys(FCK).length,NCH=REG.reduce((a,r)=>a+D(r).topics.length,0);
/* ---------- settings / theme ---------- */
let mq=null;try{mq=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)")}catch(e){}
function apply(){const st=S.set,th=st.theme=="system"?(mq&&mq.matches?"dark":"light"):st.theme;
 const r=document.documentElement;r.dataset.theme=th;r.style.setProperty("--ac",st.accent);r.style.fontSize=(+st.font||16)+"px";
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=th=="dark"?"#10131a":"#f4f6fb"}
if(mq){try{mq.addEventListener("change",apply)}catch(e){try{mq.addListener(apply)}catch(_){}}}
/* ---------- feedback ---------- */
let AC=null;
function feedback(ok){if(S.set.sound){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type="sine";o.frequency.value=ok?880:220;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3)}catch(e){}}
 if(S.set.vib){try{navigator.vibrate&&navigator.vibrate(ok?35:[70,50,70])}catch(e){}}}
/* ---------- stats ---------- */
function record(q,ok){S.seen[q.id]=1;if(ok)delete S.missed[q.id];else S.missed[q.id]=(S.missed[q.id]||0)+1;
 const r=regOf(q),tp=(S.tp[r]=S.tp[r]||{}),T=(tp[q.t]=tp[q.t]||{c:0,n:0});T.n++;if(ok)T.c++;
 const d=today();S.days[d]=(S.days[d]||0)+1}
function streak(){let n=0;const d=new Date();if(!S.days[dkey(d)]&&!S.cdays[dkey(d)]&&!S.rdays[dkey(d)])d.setDate(d.getDate()-1);
 while(S.days[dkey(d)]||S.cdays[dkey(d)]||S.rdays[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function bestStreak(){const ks=[...new Set([...Object.keys(S.days),...Object.keys(S.cdays),...Object.keys(S.rdays)])].sort();let b=0,c=0,p=null;
 ks.forEach(k=>{const d=new Date(k+"T12:00:00");c=p&&Math.round((d-p)/864e5)==1?c+1:1;b=Math.max(b,c);p=d});return b}
function chStat(r,t){const x=(S.tp[r]||{})[t];return x&&x.n?x:null}
const pct=x=>x&&x.n?Math.round(100*x.c/x.n):null;
function weakTopics(n){const L=[];REG.forEach(r=>D(r).topics.forEach(t=>{const x=chStat(r,t);if(x&&x.n>=3&&x.c/x.n<.8)L.push({r,t,x,p:x.c/x.n})}));return L.sort((a,b)=>a.p-b.p||b.x.n-a.x.n).slice(0,n)}
function totals(){let c=0,n=0;Object.values(S.tp).forEach(o=>Object.values(o).forEach(x=>{c+=x.c;n+=x.n}));return{c,n}}
/* ---------- routing ---------- */
let route=[];function toTop(){try{const e=document.scrollingElement||document.documentElement;if(e)e.scrollTop=0}catch(e){}}
function go(p){const h="#/"+p;if(location.hash!==h)location.hash=h;else render()}
const NAV=[];
function navTrack(){const h=location.hash&&location.hash!="#/"?location.hash:"#/home";if(NAV.length>1&&NAV[NAV.length-2]==h)NAV.pop();else if(NAV[NAV.length-1]!==h)NAV.push(h);const b=document.getElementById("bk");if(b)b.style.display=route[0]=="home"||!(route[0]in TITLES)?"none":""}
window.appBack=function(){if(window.ivOpen&&ivOpen()){closeViewer();return true}
 if(route[0]=="home"||!(route[0]in TITLES))return false;
 if(NAV.length>1)history.back();else{NAV.length=0;location.replace("#/home")}return true};
window.addEventListener("hashchange",render);
let timer=null;function clearTimer(){if(timer){clearInterval(timer);timer=null}}
const TITLES={home:"Home",study:"Study",quiz:"Quiz",cards:"Flashcards",prog:"Progress",set:"Settings",about:"About",search:"Search",bm:"Bookmarks"};
function render(){clearTimer();route=(location.hash.replace(/^#\/?/,"")||"home").split("/");const v=route[0]in TITLES?route[0]:"home";navTrack();
 $$("nav.bot a").forEach(a=>a.classList.toggle("on",a.dataset.v==v||(v=="about"&&a.dataset.v=="set")));
 $("#ttl").textContent=v=="home"?"Dashboard":TITLES[v];
 const el=$("#view");({home,study,quiz,cards,prog,set:settings,about,search,bm:bookmarks})[v](el);
 if(!(v=="search"))toTop()}
/* ---------- shared bits ---------- */
const starQ=id=>`<button class="star" data-bmq="${esc(id)}" title="Bookmark">${S.bm.q[id]?"★":"☆"}</button>`;
const starF=k=>`<button class="star" data-bmf="${esc(k)}" title="Bookmark">${S.bm.f[k]?"★":"☆"}</button>`;
function regOpts(sel,all){return(all?`<option value="all" ${sel=="all"?"selected":""}>All sections (${NQ})</option>`:"")+REG.map(r=>`<option value="${r}" ${r==sel?"selected":""}>${esc(D(r).name)} – ${esc(D(r).vol)}</option>`).join("")}
function chOpts(r,sel,kind){if(r=="all")return`<option value="">All chapters</option>`;const d=D(r);
 const cnt=t=>kind=="f"?d.fc.filter(f=>f[2]==t).length:d.mcq.filter(q=>q.t==t).length;
 return`<option value="">All chapters (${kind=="f"?d.fc.length:d.mcq.length})</option>`+d.topics.map((t,i)=>`<option value="${i}" ${String(i)===String(sel)?"selected":""}>${i+1}. ${esc(t)} (${cnt(t)})</option>`).join("")}
function qpool(r,ci){if(r=="all")return Object.values(byId);const d=D(r);return ci===""||ci==null?d.mcq:d.mcq.filter(q=>q.t==d.topics[+ci])}
function fig(i){return`<figure><img src="images/${esc(i.f)}" alt="${esc(i.t||i.c)}" loading="lazy"><figcaption>${i.t?`<b>${esc(i.t)}</b> – `:""}${esc(i.c)}<br><small>Source: ${esc(i.by)} · ${esc(i.src)} via Wikimedia Commons (${esc(i.url)}) · Licence: ${esc(i.lic)}</small></figcaption></figure>`}
function qcard(q){return`<div class="card">${starQ(q.id)}<small class="mut">${esc(D(regOf(q)).name)} · ${esc(q.t)}</small>${q.img?`<img class="qimg" src="images/${esc(q.img)}" alt="">`:""}<div><b>${esc(q.q)}</b></div><details style="border:0;padding:4px 0;margin:4px 0"><summary class="mut">Show answer</summary>✔ ${esc(q.o[q.a])}<br><small>${esc(q.e)}</small></details></div>`}
function fcard(k){const x=FCK[k];if(!x)return"";const[r,f]=x;return`<div class="card">${starF(k)}<small class="mut">${esc(D(r).name)} · ${esc(f[2])}</small><div><b>${esc(f[0])}</b></div><div>${esc(f[1])}</div></div>`}
/* ---------- quiz engine ---------- */
function startQuiz(list,meta){if(!list.length){alert("No questions in this selection yet.");return}
 S.cq=Object.assign({ids:list.map(q=>q.id),qi:0,score:0,ans:[],ord:[],done:false,t0:Date.now()},meta);
 S.last={mode:"quiz",r:meta.r,ci:meta.ci};save();go("quiz/run")}
function smartPick(L,n){const sc=q=>(S.missed[q.id]?0:S.seen[q.id]?2:1)+Math.random();return[...L].sort((a,b)=>sc(a)-sc(b)).slice(0,n)}
function practise(r,t){startQuiz(shuf(smartPick(qpool(r,chIdx(r,t)),10)),{r,ci:String(chIdx(r,t)),label:D(r).name+" – "+t})}
/* ---------- HOME ---------- */
function dash(){const nr=Object.keys(S.read).filter(k=>{const[r,i]=k.split("|");return D(r)&&D(r).topics[+i]!=null}).length,p=Math.round(100*nr/NCH);

/* ---------- SEARCH ---------- */
let SQ="";
function search(v){if(!$("#sq")){v.innerHTML=`<input type="search" id="sq" placeholder="Search notes, facts and questions…" autocomplete="off"><div id="sr"></div>`;
  $("#sq").value=SQ;let tm;$("#sq").oninput=e=>{SQ=e.target.value;clearTimeout(tm);tm=setTimeout(results,180)}}
 results();try{$("#sq").focus()}catch(e){}}
function results(){const box=$("#sr");if(!box)return;const w=SQ.toLowerCase().split(/\s+/).filter(x=>x.length>1);
 if(!w.length){box.innerHTML=`<p class="mut">Type at least 2 letters. Searches summary notes, flashcard facts and question stems/answers in all sections.</p>`;return}
 const hit=s=>{s=s.toLowerCase();return w.every(x=>s.includes(x))};
 const hl=t=>{let h=esc(t);w.forEach(x=>{const re=new RegExp("("+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/[&<>"']/g,"")+")","ig");if(x.replace(/[&<>"']/g,""))h=h.replace(re,'<mark class="hi">$1</mark>')});return h};
 const N=[],F=[],Q=[];
 REG.forEach(r=>{const d=D(r);d.notes.forEach(n=>{if(hit(n[0]+" "+n[1]))N.push([r,n])});d.fc.forEach(f=>{if(hit(f[0]+" "+f[1]))F.push(r+"|"+f[0])});d.mcq.forEach(q=>{if(hit(q.q+" "+q.o[q.a]))Q.push(q)})});
 box.innerHTML=`<p class="mut">${N.length} notes · ${F.length} facts · ${Q.length} questions</p>`+
 (N.length?`<h3>Notes</h3>`+N.slice(0,20).map(([r,n])=>`<details><summary>${esc(D(r).name)} · ${hl(n[0])}</summary><p>${hl(n[1])}</p></details>`).join(""):"")+
 (F.length?`<h3>Facts</h3>`+F.slice(0,40).map(k=>{const[r,f]=FCK[k];return`<div class="card">${starF(k)}<small class="mut">${esc(D(r).name)} · <a href="#/study/${r}/${chIdx(r,f[2])}">${esc(f[2])}</a></small><div><b>${hl(f[0])}</b></div><div>${hl(f[1])}</div></div>`}).join("")+(F.length>40?`<p class="mut">…${F.length-40} more facts – refine your search</p>`:""):"")+
 (Q.length?`<h3>Questions</h3>`+(Q.length>1?`<button id="sqz">Quiz these ${Math.min(Q.length,50)} questions</button>`:"")+Q.slice(0,30).map(qcard).join("")+(Q.length>30?`<p class="mut">…${Q.length-30} more questions</p>`:""):"");
 const b=$("#sqz");if(b)b.onclick=()=>startQuiz(shuf(Q).slice(0,50),{r:"all",ci:"",label:"Search: "+SQ})}

 else if(b.dataset.bmq){const id=b.dataset.bmq;if(S.bm.q[id])delete S.bm.q[id];else S.bm.q[id]=1;save();$$(`[data-bmq="${typeof CSS!="undefined"&&CSS.escape?CSS.escape(id):id}"]`).forEach(x=>x.textContent=S.bm.q[id]?"★":"☆")}
 else if(b.dataset.bmf){e.stopPropagation();const k=b.dataset.bmf;if(S.bm.f[k])delete S.bm.f[k];else S.bm.f[k]=1;save();b.textContent=S.bm.f[k]?"★":"☆"}

/* ---------- full-screen image viewer (pinch / double-tap / pan / wheel) ---------- */
(function(){const ov=document.createElement("div");ov.id="iv";ov.setAttribute("role","dialog");
 ov.innerHTML=`<div class="zb"><button data-z="in" aria-label="Zoom in">＋</button><button data-z="out" aria-label="Zoom out">－</button><button data-z="fit" aria-label="Fit">⤢</button></div><button class="x" aria-label="Close">✕</button><img alt=""><div class="cap"></div>`;
 document.body.appendChild(ov);const im=ov.querySelector("img"),cap=ov.querySelector(".cap");
 let s=1,x=0,y=0,bw=0,bh=0,open=false;const P=new Map();let pinch=null,last=0,moved=false,tdbl=0;
 function fit(){const vw=innerWidth,vh=innerHeight,nw=im.naturalWidth||1,nh=im.naturalHeight||1,k=Math.min(vw/nw,vh/nh,3);bw=nw*k;bh=nh*k;im.style.width=bw+"px";im.style.height=bh+"px";im.style.maxWidth="none";im.style.maxHeight="none";s=1;x=(vw-bw)/2;y=(vh-bh)/2;apply()}
 function clamp(){const vw=innerWidth,vh=innerHeight,w=bw*s,h=bh*s;x=w<=vw?(vw-w)/2:Math.min(0,Math.max(vw-w,x));y=h<=vh?(vh-h)/2:Math.min(0,Math.max(vh-h,y))}
 function apply(){clamp();im.style.left="0";im.style.top="0";im.style.transform=`translate(${x}px,${y}px) scale(${s})`}
 function zoomAt(ns,cx,cy){ns=Math.max(1,Math.min(8,ns));x=cx-(cx-x)*ns/s;y=cy-(cy-y)*ns/s;s=ns;apply()}
 window.openViewer=function(src,text){im.onload=fit;im.src=src;cap.textContent=text||"";ov.classList.add("on");open=true;document.body.style.overflow="hidden";try{history.pushState({iv:1},"")}catch(e){}if(im.complete)fit()};
 function close(fromPop){if(!open)return;open=false;ov.classList.remove("on");document.body.style.overflow="";P.clear();pinch=null;if(!fromPop){try{if(history.state&&history.state.iv)history.back()}catch(e){}}}
 window.closeViewer=()=>close(false);window.ivOpen=()=>open;
 window.addEventListener("popstate",()=>{if(open)close(true)});
 ov.querySelector(".x").onclick=e=>{e.stopPropagation();close(false)};
 ov.querySelector(".zb").onclick=e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();const cx=innerWidth/2,cy=innerHeight/2;if(b.dataset.z=="in")zoomAt(s*1.6,cx,cy);else if(b.dataset.z=="out")zoomAt(s/1.6,cx,cy);else fit()};
 document.addEventListener("keydown",e=>{if(open&&e.key=="Escape")close(false)});
 ov.addEventListener("wheel",e=>{e.preventDefault();zoomAt(s*(e.deltaY<0?1.2:1/1.2),e.clientX,e.clientY)},{passive:false});
 ov.addEventListener("dblclick",e=>{e.preventDefault();if(Date.now()-tdbl<700)return;s>1.05?fit():zoomAt(2.5,e.clientX,e.clientY)});
 ov.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;ov.setPointerCapture&&ov.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(P.size==2){const[a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,x,y}}});
 ov.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;const p=P.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
  if(P.size>=2&&pinch){const[a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,ns=Math.max(1,Math.min(8,pinch.s*d/pinch.d));
   x=cx-(pinch.cx-pinch.x)*ns/pinch.s;y=cy-(pinch.cy-pinch.y)*ns/pinch.s;s=ns;apply()}
  else if(P.size==1&&s>1){x+=dx;y+=dy;apply()}});
 const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);if(P.size<2)pinch=null;
  if(e.type=="pointerup"&&!moved&&P.size==0&&e.pointerType!="mouse"){const t=Date.now();if(t-last<300){s>1.05?fit():zoomAt(2.5,e.clientX,e.clientY);last=0;tdbl=t}else last=t}};
 ov.addEventListener("pointerup",up);ov.addEventListener("pointercancel",up);
 window.addEventListener("resize",()=>{if(open)fit()});
 document.addEventListener("click",e=>{const i=e.target.closest("main img");if(!i||i.closest("#iv"))return;e.preventDefault();const f=i.closest("figure");openViewer(i.getAttribute("src"),f?(f.querySelector("figcaption").innerText||f.querySelector("figcaption").textContent).replace(/\s*\n\s*/g," · "):(i.alt||""))});
})();
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW",e)));</script></body></html>
